name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let in-flight runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A half-applied version stamp leaves some pages naming one release and
      # the rest another, which is worse than no version at all -- catch it
      # before it is published. Deliberately not compared against
      # `git describe`: main normally sits ahead of the last tag, so that
      # comparison would fail every deploy between releases.
      - name: Check the stamped site version is consistent
        run: python3 tools/set-site-version.py --check

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # The legacy branch-based build serves the tracked tree, not .git itself;
      # drop it here too so the artifact matches what was previously published.
      - name: Remove .git before publishing
        run: rm -rf .git

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
