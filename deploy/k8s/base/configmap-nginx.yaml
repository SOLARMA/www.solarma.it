apiVersion: v1
kind: ConfigMap
metadata:
  name: solarma-site-nginx
data:
  default.conf: |
    server {
        listen       8080;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # --- Security headers -------------------------------------------------
        # NOTE: a location block that declares its own add_header discards every
        # add_header inherited from here. That is why the cache rules below use
        # only `expires`, which is a separate directive and preserves these.
        add_header X-Content-Type-Options   "nosniff"                       always;
        add_header X-Frame-Options          "SAMEORIGIN"                    always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

        # The site loads no inline <script>, so script-src needs no 'unsafe-inline'.
        # style-src does, because the pages use inline style="..." attributes.
        # The googletagmanager / google-analytics origins are needed only after a
        # visitor accepts analytics; drop them if you remove GA entirely.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

        # --- Compression ------------------------------------------------------
        gzip              on;
        gzip_vary         on;
        gzip_min_length   512;
        gzip_proxied      any;
        gzip_types        text/plain text/css application/javascript
                          image/svg+xml application/xml application/json;

        # --- Probes -----------------------------------------------------------
        location = /healthz {
            access_log   off;
            default_type text/plain;
            return       200 "ok\n";
        }

        # --- Caching ----------------------------------------------------------
        # Fingerprint-free filenames, so keep HTML short-lived and assets long.
        location /assets/ { expires 30d; }
        location /images/ { expires 30d; }
        location ~* \.html$ { expires 5m; }

        # --- Routing ----------------------------------------------------------
        # $uri.html also lets /azienda resolve to /azienda.html, should you ever
        # want to drop the extension from the URLs.
        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        error_page 404 /404.html;
        location = /404.html { internal; }
    }
