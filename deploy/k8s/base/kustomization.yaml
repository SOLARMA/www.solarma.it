apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap-site-source.yaml
  - configmap-nginx.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# `labels` rather than the deprecated `commonLabels`, and deliberately without
# includeSelectors: a Deployment's matchLabels is immutable once created, so
# labels must not be injected into it. The selector is declared explicitly in
# deployment.yaml and service.yaml instead.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: solarma-site
      app.kubernetes.io/part-of: solarma-website
